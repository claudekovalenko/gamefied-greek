<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Koine Quest</title>
  <meta name="description" content="Learn Biblical Koine Greek as a game and read the New Testament in the original.">
  <meta name="theme-color" content="#1f3b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Koine Quest">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="world" class="world"><div id="whud" class="whud"></div></div>
  <header id="topbar" class="topbar"></header>
  <main id="main" class="main"></main>
  <nav id="nav" class="nav">
    <button data-act="go" data-arg="world"><span>🏞</span>World</button>
    <button data-act="go" data-arg="path"><span>🗺</span>Path</button>
    <button data-act="go" data-arg="review"><span>🔁</span>Review</button>
    <button data-act="go" data-arg="arcade"><span>🎮</span>Arcade</button>
    <button data-act="go" data-arg="codex"><span>📖</span>Library</button>
    <button data-act="go" data-arg="profile"><span>👤</span>Profile</button>
  </nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Koine Quest needs JavaScript to run.</noscript>

  <script src="js/data/alphabet.js"></script>
  <script src="js/data/vocab.js"></script>
  <script src="js/data/grammar.js"></script>
  <script src="js/data/readings.js"></script>
  <script src="js/data/curriculum.js"></script>
  <script src="js/data/passages.js"></script>
  <script src="js/data/teach.js"></script>
  <script src="js/engine.js"></script>
  <script type="module" src="js/world.js" data-world></script>
  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
